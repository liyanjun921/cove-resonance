<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>贴贴 · 私人图库</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#f6faff,#e9f1ff 60%,#fbf4fb);font-family:system-ui,-apple-system,'PingFang SC',sans-serif;color:#344057;min-height:100vh}.page{max-width:740px;margin:0 auto;padding:25px 18px}.head{font-size:24px;font-weight:700;margin-bottom:4px}.sub{font-size:12px;color:#7e90ad;margin-bottom:20px}.panel{background:#ffffffd9;border:1px solid #d6e3f8;border-radius:20px;box-shadow:0 9px 24px #bac8da29;padding:20px;margin:14px 0}.panel h2{font-size:16px;margin:0 0 12px}label{display:block;color:#637794;font-size:12px;margin:12px 0 5px}input{background:white;width:100%;border:1px solid #d1def1;border-radius:12px;padding:11px 12px;font-size:14px;outline:none}button{background:#809bca;color:white;border:0;border-radius:12px;padding:10px 16px;font-size:13px;cursor:pointer}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}@media(min-width:500px){.grid{grid-template-columns:repeat(5,1fr)}}.tile{border-radius:13px;background:#f8faff;border:1px solid #dee8f5;padding:9px}.tile img{width:100%;aspect-ratio:1;object-fit:contain}.tile small{display:block;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tile button{display:block;background:#f0e5eb;color:#9c6382;margin:5px auto;font-size:11px;padding:5px 8px}.hide{display:none}.note{font-size:12px;line-height:1.8;color:#7085a6}.warn{color:#aa7154}.flex{display:grid;grid-template-columns:1fr 1fr;gap:10px}#status{font-size:12px;color:#7183a6;margin-top:12px;white-space:pre-wrap}
</style></head><body><div class="page"><div class="head">♡ 贴贴 · 私人图库</div><div class="sub">你的 ChatGPT 表情包收纳盒 · iPhone 可上传图片</div><div class="panel"><h2>① 管理员验证</h2><label>输入 Render 环境变量 ADMIN_KEY</label><input id="key" type="password" autocomplete="off" placeholder="私人管理员密钥"><p><button id="login">连接我的图库</button></p><div class="note">只在浏览器内存中使用此密钥，不保存到本地存储或 ChatGPT 聊天记录。</div></div><div class="panel hide" id="uploadbox"><h2>② 从手机上传表情包</h2><label>选择 PNG/JPG/WebP/GIF，支持一次选多张</label><input type="file" id="files" accept="image/png,image/jpeg,image/gif,image/webp" multiple><div class="flex"><div><label>分类</label><input id="category" placeholder="例如：猫猫、撒娇"></div><div><label>检索关键词</label><input id="tags" placeholder="亲亲 抱抱 晚安"></div></div><p><button id="upload">上传表情包</button></p><div id="status" role="status"></div><p class="note warn">当前 Render 免费方案采用临时文件系统；重启或部署可能丢失上传图片。先用非私密图片测试，待接入持久化存储再正式迁移图库。</p></div><div class="panel hide" id="gallery"><h2>③ 已有表情包</h2><div id="grid" class="grid"></div></div></div><script>
(()=>{'use strict';const $=x=>document.getElementById(x);let key='';
async function request(url,body){const r=await fetch(url,{method:body?'POST':'GET',headers:{'X-Admin-Key':key,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.message||d.error);return d}
async function refresh(){const d=await request('/admin/stickers');$('grid').replaceChildren();for(const x of d.stickers){const card=document.createElement('div');card.className='tile';const img=document.createElement('img');img.src=x.preview_url;img.referrerPolicy='no-referrer';img.alt=x.title;const title=document.createElement('small');title.textContent=x.title;card.append(img,title);if(!x.demo){const b=document.createElement('button');b.textContent='删除';b.onclick=async()=>{if(!confirm('确定删除这张表情？'))return;await request('/admin/delete',{id:x.id});await refresh()};card.append(b)}$('grid').append(card)}}
$('login').onclick=async()=>{key=$('key').value.trim();try{await refresh();$('key').value='';$('uploadbox').classList.remove('hide');$('gallery').classList.remove('hide')}catch(e){alert('验证失败：'+e.message)}};
function toBase64(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(file)})}
$('upload').onclick=async()=>{const files=[...$('files').files];if(!files.length)return;$('upload').disabled=true;let done=0,failed=[];for(const f of files){if(f.size>6*1024*1024){failed.push(f.name+': 超过6MB');continue}try{await request('/admin/upload',{filename:f.name,title:f.name.replace(/\.[^.]+$/,''),category:$('category').value||'默认',tags:$('tags').value,data_base64:await toBase64(f)});done++;$('status').textContent='已上传 '+done+'/'+files.length}catch(e){failed.push(f.name+': '+e.message)}}$('upload').disabled=false;$('status').textContent='成功 '+done+' 张'+(failed.length?'\n失败：'+failed.join('\n'):'');await refresh()};
})();</script></body></html>
