<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>贴贴 · 单张表情</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:0;background:transparent}
body{display:flex;align-items:center;justify-content:flex-start;padding:8px;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",system-ui,sans-serif}
main{display:inline-flex;align-items:center;justify-content:flex-start;min-width:0;max-width:100%}
img{display:block;width:auto;height:auto;max-width:min(180px,52vw);max-height:180px;object-fit:contain;border:0;border-radius:10px}
#status{font-size:12px;color:#8b93a3;padding:6px 2px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main aria-live="polite">
<img id="sticker" alt="" hidden>
<div id="status" hidden>这张表情暂时无法显示。</div>
</main>
<script>
(function(){
  "use strict";
  const image=document.getElementById("sticker");
  const status=document.getElementById("status");
  let nextId=1;
  const pending=new Map();
  let currentId=null;
  let retrying=false;
  let lastData=null;
  function api(){return window.openai||{}}
  function unwrap(raw){
    if(!raw)return null;
    if(raw.structuredContent)return raw.structuredContent;
    if(raw.result&&raw.result.structuredContent)return raw.result.structuredContent;
    if(raw.result&&raw.result.content)return unwrap(raw.result);
    if(raw.params&&raw.params.structuredContent)return raw.params.structuredContent;
    return raw;
  }
  function outputData(){
    const a=api();
    return unwrap(a.toolOutput||a.tool_output||null);
  }
  function saveState(data){
    const a=api();
    if(typeof a.setWidgetState==="function"){
      try{a.setWidgetState({sticker_id:data.id,title:data.title||data.alt||"表情包"})}catch(e){}
    }
  }
  function request(method,params){
    const id=nextId++;
    window.parent.postMessage({jsonrpc:"2.0",id,method,params},"*");
    return new Promise((resolve,reject)=>pending.set(id,{resolve,reject}));
  }
  function notify(method,params){
    window.parent.postMessage({jsonrpc:"2.0",method,params},"*");
  }
  function showData(raw){
    const data=unwrap(raw);
    const candidate=data&&(data.image_url||data.imageUrl||data.url);
    if(typeof candidate!=="string")return false;
    let url;
    try{url=new URL(candidate)}catch(e){return false}
    if(url.protocol!=="https:"||!["xlc-stickers.onrender.com","pic1.imgdb.cn","raw.githubusercontent.com"].includes(url.hostname))return false;
    lastData=data;
    currentId=data.id||currentId;
    image.onload=function(){image.hidden=false;status.hidden=true;retrying=false};
    image.onerror=function(){
      image.hidden=true;
      if(!retrying&&currentId){retrying=true;refreshSticker()}
      else {status.hidden=false;retrying=false}
    };
    image.alt=String(data.title||data.alt||"表情包");
    image.src=url.href;
    status.hidden=true;
    saveState({...data,id:currentId});
    return true;
  }
  async function refreshSticker(){
    const id=currentId||(api().widgetState||{}).sticker_id;
    if(!id){status.hidden=false;return}
    try{
      const a=api();
      let result;
      if(typeof a.callTool==="function") result=await a.callTool("send_sticker",{sticker_id:id});
      else result=await request("tools/call",{name:"send_sticker",arguments:{sticker_id:id}});
      if(!showData(result)){status.hidden=false;retrying=false}
    }catch(e){status.hidden=false;retrying=false}
  }
  function render(){
    const data=outputData();
    if(data&&showData(data))return;
    const state=api().widgetState||{};
    if(state.sticker_id){currentId=state.sticker_id;refreshSticker()}
    else status.hidden=false;
  }
  window.addEventListener("message",function(event){
    if(event.source!==window.parent)return;
    const message=event.data;
    if(!message||message.jsonrpc!=="2.0")return;
    if(message.id!==undefined&&pending.has(message.id)){
      const item=pending.get(message.id);pending.delete(message.id);
      if(message.error)item.reject(message.error);else item.resolve(message.result);
      return;
    }
    if(message.method==="ui/notifications/tool-result"){
      const data=unwrap(message.params);
      if(!showData(data))status.hidden=false;
    }else if(message.method==="ui/notifications/tool-input"){
      // The tool result arrives separately via ui/notifications/tool-result.
    }
  });
  async function initialize(){
    try{
      const result=await request("ui/initialize",{
        appInfo:{name:"xlc-stickers-single",version:"2.0.0"},
        appCapabilities:{availableDisplayModes:["inline"]}
      });
      notify("ui/notifications/initialized",{});
      if(result&&result.hostContext) { /* host context is optional for this widget */ }
    }catch(e){ /* Legacy ChatGPT bridge below remains available. */ }
    render();
  }
  window.addEventListener("openai:tool-output",render);
  window.addEventListener("openai:toolOutput",render);
  if(api().toolOutput||api().tool_output)render();
  initialize();
})();
</script>
</body>
</html>
