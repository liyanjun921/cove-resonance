name: Phone activity receiver tests
on:
  push:
    branches: [feat/private-phone-activity-bridge]
    paths:
      - "phone-activity/**"
      - ".github/workflows/phone-activity-tests.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: HTTP event ingestion tests
        run: python -m unittest discover -s phone-activity -p "test_*.py" -v
