<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>贴贴 · 单张表情</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:0;background:transparent}
body{display:flex;align-items:center;justify-content:flex-start;padding:8px;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",system-ui,sans-serif}
main{display:inline-flex;align-items:center;justify-content:flex-start;min-width:0;max-width:100%}
img{display:block;width:auto;height:auto;max-width:min(180px,50vw);max-height:180px;object-fit:contain;border:0;border-radius:10px}
#status{font-size:12px;color:#8b93a3;padding:6px 2px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main aria-live="polite">
<img id="sticker" alt="" hidden>
<div id="status" hidden>这张表情暂时无法显示。</div>
</main>
<script>
(function () {
  "use strict";
  const img = document.getElementById("sticker");
  const status = document.getElementById("status");
  const allowed = new Set(["xlc-stickers.onrender.com", "pic1.imgdb.cn", "raw.githubusercontent.com"]);
  const pending = new Map();
  let nextMessageId = 1000;
  let currentId = null;
  let rendered = false;
  let initialized = false;
  let retryAttempted = false;
  let recovering = false;
  let lastUrl = "";

  function host() { return window.openai || {}; }

  // Both ChatGPT's window.openai bridge and the MCP Apps postMessage bridge
  // may deliver the result in different wrappers or as JSON text content.
  function unpack(value, depth) {
    if (depth > 6 || value == null) return null;
    if (typeof value === "string") {
      try { return unpack(JSON.parse(value), depth + 1); } catch (e) { return null; }
    }
    if (Array.isArray(value)) {
      for (const item of value) {
        const got = unpack(item, depth + 1);
        if (got) return got;
      }
      return null;
    }
    if (typeof value !== "object") return null;
    if (typeof value.image_url === "string" || typeof value.imageUrl === "string") return value;
    if (value.structuredContent) return unpack(value.structuredContent, depth + 1);
    if (value.toolOutput) return unpack(value.toolOutput, depth + 1);
    if (value.tool_output) return unpack(value.tool_output, depth + 1);
    if (value.result) return unpack(value.result, depth + 1);
    if (value.params) return unpack(value.params, depth + 1);
    if (value.content) return unpack(value.content, depth + 1);
    if (typeof value.text === "string") return unpack(value.text, depth + 1);
    return null;
  }

  function readInputId(raw) {
    const value = raw && raw.arguments ? raw.arguments : raw;
    return value && typeof value.sticker_id === "string" ? value.sticker_id : null;
  }

  function rememberId(raw) {
    const id = readInputId(raw);
    if (id) currentId = id;
  }

  function notifySize() {
    const height = Math.max(28, Math.ceil(document.body.getBoundingClientRect().height));
    const width = Math.max(40, Math.ceil(document.body.getBoundingClientRect().width));
    try {
      window.parent.postMessage({
        jsonrpc: "2.0",
        method: "ui/notifications/size-changed",
        params: { height: height, width: width }
      }, "*");
    } catch (e) {}
  }

  function showStatus(message) {
    if (rendered) return;
    status.textContent = message;
    status.hidden = false;
    notifySize();
  }

  function saveState(data) {
    const api = host();
    if (typeof api.setWidgetState !== "function") return;
    try { api.setWidgetState({ sticker_id: data.id || currentId, title: data.title || "表情包" }); }
    catch (e) {}
  }

  function display(raw) {
    const data = unpack(raw, 0);
    if (!data) return false;
    let url;
    try { url = new URL(data.image_url || data.imageUrl || ""); }
    catch (e) { return false; }
    if (url.protocol !== "https:" || !allowed.has(url.hostname)) return false;
    if (data.id) currentId = data.id;
    if (rendered && lastUrl === url.href) return true;
    lastUrl = url.href;
    img.onload = function () {
      rendered = true;
      img.hidden = false;
      status.hidden = true;
      notifySize();
    };
    img.onerror = function () {
      img.hidden = true;
      rendered = false;
      if (!retryAttempted) {
        retryAttempted = true;
        recover();
      } else {
        showStatus("图片加载失败，请重新发送这张表情包。");
      }
    };
    img.alt = String(data.title || data.alt || "表情包");
    img.src = url.href;
    saveState(data);
    return true;
  }

  async function recover() {
    const api = host();
    const state = api.widgetState || {};
    const id = currentId || readInputId(api.toolInput) || state.sticker_id;
    if (recovering || !id) {
      showStatus("暂未收到表情数据，请让 AI 重新发送表情包。");
      return;
    }
    if (typeof api.callTool !== "function") {
      showStatus("手机端没有提供表情数据，请让 AI 重新发送表情包。");
      return;
    }
    recovering = true;
    try {
      const result = await api.callTool("send_sticker", { sticker_id: id });
      if (!display(result)) showStatus("未能恢复表情包数据。");
    } catch (e) {
      showStatus("暂时无法恢复表情包，请重试。");
    } finally {
      recovering = false;
    }
  }

  function renderHostGlobals(raw) {
    const api = host();
    rememberId(api.toolInput);
    const state = api.widgetState || {};
    if (!currentId && state.sticker_id) currentId = state.sticker_id;
    return display(raw) || display(api.toolOutput) || display(api.tool_output) || display(api.toolResult);
  }

  function requestInitialize() {
    if (!window.parent || window.parent === window) return;
    const id = nextMessageId++;
    pending.set(id, true);
    try {
      window.parent.postMessage({
        jsonrpc: "2.0",
        id: id,
        method: "ui/initialize",
        params: {
          protocolVersion: "2026-01-26",
          appInfo: { name: "xlc-stickers-single", version: "4.0.0" },
          appCapabilities: {}
        }
      }, "*");
    } catch (e) { pending.delete(id); }
  }

  window.addEventListener("message", function (event) {
    if (event.source !== window.parent) return;
    const message = event.data;
    if (!message || typeof message !== "object") return;
    if (message.jsonrpc === "2.0" && pending.has(message.id)) {
      pending.delete(message.id);
      initialized = !message.error;
      if (initialized) {
        window.parent.postMessage({ jsonrpc: "2.0", method: "ui/notifications/initialized", params: {} }, "*");
      }
      renderHostGlobals(message);
      notifySize();
      return;
    }
    if (message.method === "ui/notifications/tool-input") {
      rememberId(message.params);
    } else if (message.method === "ui/notifications/tool-result") {
      display(message.params);
    } else if (message.method === "openai:set_globals") {
      renderHostGlobals(message.globals || message.params || message);
    }
  });
  window.addEventListener("openai:set_globals", function (event) {
    renderHostGlobals(event.detail);
  });
  window.addEventListener("openai:tool-output", function (event) {
    display(event.detail) || renderHostGlobals(event.detail);
  });
  window.addEventListener("openai:toolOutput", function (event) {
    display(event.detail) || renderHostGlobals(event.detail);
  });

  renderHostGlobals(null);
  requestInitialize();
  // Never leave an unexplained empty grey card on a mobile client.
  setTimeout(function () {
    if (!rendered) {
      if (currentId && !retryAttempted) {
        retryAttempted = true;
        recover();
      } else {
        showStatus("表情包组件未收到图片数据，请让 AI 重新发送。");
      }
    }
  }, 4500);
  if (typeof ResizeObserver !== "undefined") {
    new ResizeObserver(notifySize).observe(document.querySelector("main"));
  }
  notifySize();
})();
</script>
</body>
</html>
