<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>贴贴 · Sticker Library</title><style>
:root{color-scheme:light;--ink:#2a3348;--muted:#8590a5;--blue:#758fcb;--border:rgba(166,187,216,.36)}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',system-ui,sans-serif;background:linear-gradient(145deg,#f8fbff,#eff5ff 60%,#fdf8fd);color:var(--ink)}main{padding:15px;min-height:360px}.top{display:flex;align-items:center;gap:10px;justify-content:space-between}.top h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.04em}.caption{font-size:11px;color:var(--muted)}.search{margin-top:14px;width:100%;background:#fff;border-radius:16px;border:1px solid var(--border);padding:11px 13px;font-size:14px;outline:none;box-shadow:0 4px 12px #aabbd316}.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 10px;scrollbar-width:none}.chip{white-space:nowrap;border-radius:99px;border:1px solid var(--border);background:#fff9;padding:7px 11px;font-size:12px;color:#607194;cursor:pointer}.chip.selected{color:white;background:#839ecf;border-color:#839ecf}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.item{display:block;background:#fff9;border:1px solid var(--border);border-radius:14px;padding:8px 5px;box-shadow:0 4px 13px #cbd6ed1a;cursor:pointer;transition:transform .12s}.item:active{transform:scale(.95)}.item img{display:block;aspect-ratio:1/1;object-fit:contain;width:100%}.item strong{display:block;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;font-size:11px;margin-top:5px}.status{padding:13px 0;color:#7789ac;font-size:12px;min-height:40px}.foot{font-size:10px;color:#9aa7bd;padding:8px 0}.badge{font-size:10px;border:1px solid #c9d6ed;background:#f4f9ff;border-radius:99px;padding:5px 8px;color:#6480ae}@media(min-width:470px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
</style></head><body><main><div class="top"><div><h1>♡ 贴贴 · 表情包</h1><div class="caption">为你的 ChatGPT 对话挑一张</div></div><span class="badge">私人图库</span></div><input class="search" id="search" placeholder="搜索：亲亲、哭哭、晚安、猫猫…" aria-label="搜索表情包"><div class="chips" id="chips"><button class="chip selected" data-cat="">全部</button></div><div class="grid" id="grid"></div><div class="status" id="status">正在连接表情包工具…</div><div class="foot">点击表情将调用展示工具；不能代替你作为消息发送给其他人。</div></main><script>
(function(){'use strict';const grid=document.getElementById('grid'),status=document.getElementById('status'),search=document.getElementById('search'),chips=document.getElementById('chips');let category='',last=[];
async function call(name,args){const o=window.openai;if(o&&typeof o.callTool==='function')return await o.callTool(name,args);if(window.__xlcApp&&typeof window.__xlcApp.callServerTool==='function')return await window.__xlcApp.callServerTool({name,arguments:args});throw Error('当前客户端没有开放插件 UI 的工具调用桥接。请在聊天中直接让 AI 调用 search_stickers / send_sticker。')}
function unwrap(x){if(!x)return{};if(x.structuredContent)return x.structuredContent;if(x.result?.structuredContent)return x.result.structuredContent;let c=x.content||x.result?.content||[];for(const it of c)if(it.type==='text'){try{return JSON.parse(it.text)}catch(e){}}return{}}
function paint(){grid.replaceChildren();let s=last.filter(x=>!category||x.category===category);for(const x of s){const el=document.createElement('button');el.type='button';el.className='item';el.setAttribute('aria-label','展示表情包：'+x.title);const img=document.createElement('img');img.loading='lazy';img.referrerPolicy='no-referrer';img.src=x.preview_url;img.alt=x.title;const name=document.createElement('strong');name.textContent=x.title;el.append(img,name);el.onclick=async()=>{status.textContent='正在展示「'+x.title+'」…';try{await call('send_sticker',{sticker_id:x.id});status.textContent='已调用展示工具：'+x.title+'。若未显示图片，请在聊天中请求 AI 展示这张表情。'}catch(e){status.textContent='调用失败：'+e.message}};grid.append(el)}status.textContent=s.length?'找到 '+s.length+' 张表情，点一下就能展示。':'还没有匹配的表情包。'}
async function load(){status.textContent='正在搜索…';try{const r=unwrap(await call('search_stickers',{query:search.value,limit:100}));last=r.stickers||[];const cats=[...new Set(last.map(x=>x.category))];chips.replaceChildren();for(const c of ['',...cats]){const el=document.createElement('button');el.type='button';el.className='chip'+(category===c?' selected':'');el.textContent=c||'全部';el.onclick=()=>{category=c;loadChips();paint()};el.dataset.cat=c;chips.append(el)}paint()}catch(e){status.textContent=e.message;grid.replaceChildren()}}
function loadChips(){for(const x of chips.querySelectorAll('button'))x.classList.toggle('selected',x.dataset.cat===category)}
let timer;search.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(load,250)});load();
})();</script></body></html>
