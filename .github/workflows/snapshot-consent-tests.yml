name: Consent screenshot bridge tests

on:
  push:
    branches: [feat/consented-screen-snapshot]
    paths:
      - "screen-approval/**"
      - ".github/workflows/snapshot-consent-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated dependencies
        run: python -m pip install -r screen-approval/requirements.txt
      - name: Run consent security tests
        run: python -m unittest discover -s screen-approval -p "test_*.py" -v
