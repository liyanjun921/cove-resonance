<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>贴贴 · 单张表情</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:0;background:transparent}
body{display:flex;align-items:center;justify-content:flex-start;padding:8px;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",system-ui,sans-serif}
main{display:inline-flex;align-items:center;justify-content:flex-start;min-width:0;max-width:100%}
img{display:block;width:auto;height:auto;max-width:min(280px,72vw);max-height:280px;object-fit:contain;border:0;border-radius:10px}
#status{font-size:12px;color:#8b93a3;padding:6px 2px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main aria-live="polite">
<img id="sticker" alt="" hidden>
<div id="status" hidden>这张表情暂时无法显示。</div>
</main>
<script>
(function(){
  "use strict";
  const image=document.getElementById("sticker");
  const status=document.getElementById("status");
  function outputData(){
    const api=window.openai||{};
    const raw=api.toolOutput||api.tool_output||null;
    if(!raw)return null;
    if(raw.structuredContent)return raw.structuredContent;
    if(raw.result&&raw.result.structuredContent)return raw.result.structuredContent;
    return raw;
  }
  function render(){
    const data=outputData();
    if(!data)return;
    const candidate=data.image_url||data.imageUrl||data.url;
    if(typeof candidate!=="string")return;
    try{
      const url=new URL(candidate);
      if(url.protocol!=="https:"||url.hostname!=="xlc-stickers.onrender.com"){
        status.hidden=false;
        return;
      }
      image.onload=function(){image.hidden=false;status.hidden=true};
      image.onerror=function(){image.hidden=true;status.hidden=false};
      image.alt=String(data.title||data.alt||"表情包");
      image.src=url.href;
    }catch(e){
      image.hidden=true;
      status.hidden=false;
    }
  }
  render();
  window.addEventListener("openai:tool-output",render);
  window.addEventListener("openai:toolOutput",render);
})();
</script>
</body>
</html>
